<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light"><meta name="theme-color" content="#ffffff"><title>Panda · 对话创作</title>
<link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script>
</head>
<body class="empty">
<header class="topbar">
<a class="wordmark" href="/" aria-label="Panda 首页"><img src="/assets/panda-logo-light.png" width="80" height="60" alt="Panda AI"></a>
<span id="conversation-title" class="conversation-title"></span>
<div class="header-actions">
<button id="history-button" class="icon-button" type="button" aria-label="历史对话" title="历史对话"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.3 7M3 4v7h7M12 7v5l3 2"/></svg></button>
<button id="new-button" class="icon-button" type="button" aria-label="新对话" title="新对话"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</div></header>
<main id="chat-scroll">
<section id="welcome" class="welcome">
<img class="panda-mark" src="/assets/panda-logo-light.png" width="104" height="78" alt="Panda AI">
<h1>把想法，说给 Panda。</h1>
<p class="welcome-copy">放入图片和资料，说说你想呈现什么。</p>
</section>
<section id="messages" class="messages" aria-label="对话记录" aria-live="polite" aria-relevant="additions"></section>
<div id="working" class="working" role="status" hidden><span class="working-dot"></span><span id="working-text">正在理解你的想法…</span></div>
<div id="error-area" class="error-area" role="alert" hidden><p id="error-text"></p><button type="button" id="recover-button" hidden>查看处理结果</button></div>
</main>
<div class="composer-wrap">
<form id="composer" class="composer">
<div id="attachments" class="attachments" aria-label="待发送附件" hidden></div>
<label class="sr-only" for="message-input">发消息给 Panda</label>
<textarea id="message-input" rows="2" maxlength="8000" placeholder="想做什么？发图片、传资料，或直接说。"></textarea>
<div class="composer-toolbar">
<button id="attach-button" class="attach-button" type="button" aria-label="上传图片或文件" title="上传图片或文件"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 12 6.2-6.2a3 3 0 0 1 4.2 4.2L9.7 18.7a4.5 4.5 0 0 1-6.4-6.4l9-9M6.5 14.5l8.7-8.7"/></svg><span>图片 / 文件</span></button>
<span id="file-count" class="file-count"></span>
<button id="send-button" type="submit" class="send-button" aria-label="发送消息" title="发送消息" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
</div>
<input id="file-input" type="file" accept=".png,.jpg,.jpeg,.webp,.txt,.md,.docx,.pdf,.pptx,.dwg,.dxf" multiple hidden>
</form>
<p class="composer-note" id="composer-note">发送时，模型会读取相关资料并计费；原始文件保存在本机。</p>
</div>
<div id="drop-overlay" class="drop-overlay" hidden><div><strong>把资料放在这里</strong><p>图片、文档、图纸，都可以先交给 Panda。</p></div></div>
<dialog id="history-dialog" class="history-dialog">
<div class="dialog-heading"><h2>历史对话</h2><button id="close-history" type="button" class="icon-button" aria-label="关闭历史对话">×</button></div>
<div id="history-list" class="history-list"></div>
</dialog>
<dialog id="preview-dialog" class="preview-dialog">
<div class="dialog-heading"><p id="preview-label"></p><button id="close-preview" type="button" class="icon-button" aria-label="关闭预览">×</button></div>
<img id="preview-image" alt="">
<div class="preview-nav"><button id="previous-page" type="button">上一页</button><a id="download-page" download>保存图片</a><button id="next-page" type="button">下一页</button></div>
</dialog>
</body></html>
